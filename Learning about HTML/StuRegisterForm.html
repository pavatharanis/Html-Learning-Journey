<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .color{
         background-color: yellow;
       } 
    </style>
</head>
<body>
    <center><div><h1 class="color">Student Registration Form</h1></div></center>
    <form action="">
        <fieldset>
            <legend>Personal Inforamtion</legend>
            <table>
                <tr>
                    <td><label for="">First Name:</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">Last Name:</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">Email:</label></td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td><label for="">Phone Number:</label></td>
                    <td><input type="tel"></td>
                </tr>
                <tr>
                    <td><label for="">Date of Birth:</label></td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td><label for="">Gender:</label></td>
                    <td><input type="radio" name="gender">Male
                    <input type="radio" name="gender">Female</td>
                </tr>
               
            </table>
        </fieldset>
        <br>
        <fieldset>
                    <legend>Academic Information</legend>
            <table>  
                <tr>
                    <td><label for="">Select Course</label></td>
                    <td>
                        <select name="" id="">
                            <option value="" disabled selected>--Select a Course--</option>
                            <option value="Java full stack">java full stack</option>
                            <option value="Python full stack">Python full stacxk</option>
                            <option value="Mern stack developer">Mern stack developer</option>
                        </select>
                     </td>
                </tr>
                <tr>
                    <td><label for="">Skills:</label></td>
                    <td><input type="text" placeholder="Select or type a skill"></td>
                </tr>
                <tr><td><label for="">Address:</label></td>
                <td><textarea name="" id="" cols="30" rows="5"></textarea></td>
                </tr>
            </table>
        </fieldset>
        <br>
        <fieldset>
                    <legend>Login Credentials</legend>
            <table>  
                <tr>
                    <td><label for="">Username:</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><label for="">Password:</label></td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td><label for="">Confirm Password:</label></td>
                    <td><input type="password"></td>
                </tr>
                   
                
            </table>
        </fieldset>
        <br>
        <fieldset>
                    <legend>Declaration</legend>
            <table>  
               <tr>
                <td><input type="checkbox">I agree to the terms & Conditions</td>
               </tr>
               <tr>
                    <td><button>Register</button> <button>Reset</button></td>
               </tr>
              
                
            </table>
        </fieldset>
                
                
    </form>
</body>
</html>
