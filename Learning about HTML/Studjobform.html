<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>
                <h2>Job Application Form</h2>
            </legend>
            <table>
                <tr>
                    <td><label for="">FirstName:</label></td>
                    <td><input type="text" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">LastName:</label></td>
                    <td><input type="text" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Email:</label></td>
                    <td><input type="email" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Phone Number:</label></td>
                    <td><input type="tel" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Date of Birth:</label></td>
                    <td><input type="date" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Gender:</label></td>
                    <td> <input type="radio" name="gender"/>Female
                    <input type="radio" name="gender"/>Male </td>
                </tr>
                <tr>
                    <td><label>Address:</label></td>  
                    <td><textarea name="address" rows="5" cols="30"></textarea></td>
                </tr>
                <tr>
                    <td><label for="">City:</label></td>
                    <td><input type="text" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">State:</label></td>
                    <td><input type="text" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Pin code:</label></td>
                    <td><input type="text" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Position Applied For:</label></td>
                    <td><input type="text" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Upload Resume:</label></td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td><label for="">LinkedIn Profile:</label></td>
                    <td><input type="text" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Available Start Date:</label></td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td><label for="">Expected Salary:</label></td>
                    <td><input type="text" size="25"></td>
                </tr>
                <tr>
                    <td><label for="">Willing to Relocate:</label></td>
                    <td><select name="" id=""> 
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select></td>
                </tr>
                <tr>
                    <td><button>Submit Application</button></td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
