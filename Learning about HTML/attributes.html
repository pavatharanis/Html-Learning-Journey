<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #head2{
            color: aqua;
        }
        #head3{
            color: blue;
        }
        .para{
            color:red;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>1.core attributes</h1>
    <!-- id attributes -->
    <h2 id="head2">Heading-2</h2>
    <h3 id="head3" class="para">Heading-3</h3>
    <hr>
    <!-- class attributes -->
    <p class="para" title="This is a paragraph-1">Content-1</p>
    <p class="para" title="This is a paragraph-2">Content-2</p>
    <p class="para" title="This is a paragraph-3">Content-3</p>
    <!-- style attributes -->
    <div style="width: 150px;height: 100px;background-color: blueviolet;"></div>
</body>
</html>
