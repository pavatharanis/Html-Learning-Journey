<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>min and max Attributes in HTML</h1>
    <form action="">
        <div>
            <label for="">select a course price:</label>
            <input type="range" min="5000" max="30000" name="courseprice" id=""/>
        </div>
        <br/>
        <div>
            <label for="">select interview slot:</label>
            <input type="date" min="2026-05-01" max="2026-05-20" id=""/>
        </div>
        <br/>
        <div>
            <label for="">Step Attributes in HTML:</label>
            <input type="range" min="0" max="100" step="10" id=""/>
        </div>
        <br/>
        <button>submit</button>
    </form>
</body>
</html>
