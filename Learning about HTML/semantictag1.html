<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag Element</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        #logo{
            background-color: black;
            color:white;
            padding:10px 100px;
        }
        #inline{
            margin-top: 20px;
        }
        li{
            display:inline;
            padding:10px;
        }
    </style>
</head>
<body>
    <nav>
        <h1 id="logo">MyLogo</h1>
        <ul id="inline">
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
    <main>
         <h1>Welcome to sematic tag session</h1>
         <p>here we will get to know how to use semantic tags in html </p>
         <button>Get started</button>
    </main>
    <section>
        <figure>
            <img src="./paris.jpg" alt="" height="200px" width="300px">
        </figure>    
    </section>
</body>
</html>
