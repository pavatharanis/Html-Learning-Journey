<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" width="500">
        <caption>Fruits Item</caption>
        <tr>
            <th>Fruits Image</th>
            <th>Fruits Name</th>
            <th>Price</th>
        </tr>
        <tr>
            <td><img src="./banana.jpg" alt="Banana" height="100" weight="100"></td>
            <td>Banana</td>
            <td>
                <ul>
                    <li>It is very taste</li>
                    <li>It is yellow colors</li>
                    <li>It price is 10</li>
                </ul>
            </td>
        </tr>
        <tr>
            <td><img src="./pineapple.png" alt="Pineapple" height="100" width="100"></td>
            <td>Pineapple</td>
            <td>
                <ol>
                    <li>It is my favourite food</li>
                    <li>It also very taste</li>
                    <li>It price is 50</li>
                </ol>
            </td>
        </tr>
        <tr>
            <td><img src="./strawberry.jpg" alt="strawberry" height="100" width="100"></td>
            <td>Strawberry</td>
            <td>
                <ul type="circle">
                    <li>It is red color</li>
                    <li>It is very taste</li>
                    <li>It price is 30</li>
                </ul>
            </td>
        </tr>
       
    </table>
</body>
</html>
